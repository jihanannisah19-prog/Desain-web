<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desain Web Responsive</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 10px;
            font-family: "Times New Roman", serif;
        }

        .container {
            width: 100%;
            max-width: 480px;
            margin: auto;
        }

        header, nav, .artikel, footer {
            background-color: skyblue;
            padding: 12px;
            margin-bottom: 5px;
        }

        header {
            height: 100px;
        }

        header h3 {
            margin: 0;
        }

        nav a {
            display: block;
            text-align: center;
            padding: 4px;
            color: blue;
        }

        .artikel h3 {
            margin-top: 0;
        }

        .gambar {
            margin-bottom: 5px;
        }

        .gambar img {
            display: block;
            width: 100%;
            height: auto;
        }

        footer {
            text-align: center;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="container">

        <header>
            <h3>Desain Web Responsive</h3>
        </header>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
            <a href="#">Profile</a>
            <a href="#">Guest Book</a>
        </nav>

        <div class="artikel">
            <h3>Daftar Artikel :</h3>
            <ul>
                <li><a href="#">HTML</a></li>
                <li><a href="#">CSS</a></li>
                <li><a href="#">Web Responsive</a></li>
            </ul>
        </div>

        <div class="gambar">
            <img
                src="https://blog-asset.jakartanotebook.com/2024/06/io2_desktop_640x480_fb99b254-1.webp"
                alt="Gambar Desain Web Responsive"
            >
        </div>

        <footer>
            Copyright 2026. All Right Reserved<br>
            Fakultas Bisnis Hukum dan Ilmu Sosial<br>
            Universitas Muhammadiyah Sidoarjo<br>
            Program Studi Bisnis Digital
        </footer>

    </div>
</body>
</html>
